# 校园活动组队与候补平台 · Spring Boot 配置
# 所有可变项都可由环境变量覆盖，不写死机器路径和密码。
server.port=${PORT:8080}
# HTTP 压缩（任务 20 返工，2026-11-07）：Spring Boot 默认不压缩静态资源，
# 首屏 JS 冷加载实传 89KB。开启后 JS/CSS 走 gzip，实传约 34KB。
# mime-types 含 text/javascript（Tomcat 对静态 JS 返回的 Content-Type），
# min-response-size=1KB 保证 4.9KB 的 CSS 也压缩。
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1KB
# 数据库地址：DB_URL 优先（本地沿用 jdbc:postgresql://127.0.0.1:5433/campus_buddy）；
# 未设 DB_URL 时用 DB_HOST/DB_PORT/DB_NAME 拼（Render 部署用此方式注入）。
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:campus_buddy}}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}
# 启动时建表（IF NOT EXISTS，不删已有数据）；种子数据由 SeedRunner 在空库时写入
# continue-on-error 必须为 false：旧值为 true 时建表失败会被静默吞掉，
# 应用带着残缺的表启动，之后种子写入才报错，根因极难定位。建表语句本身
# 全是 IF NOT EXISTS，正常重启不会报错，改为 fail-fast 是安全的。
spring.sql.init.mode=always
spring.sql.init.schema-locations=${DB_SCHEMA:classpath:schema.sql}
spring.sql.init.continue-on-error=false
# 递补邀请确认窗口（秒）：演示默认 120；答辩想等超时顺延时可设为 10
app.invite-ttl-seconds=${INVITE_TTL:120}
# 递补邀请白天时段（任务 8，2026-11-08 补丁，文档不改）：只在此时段内发出新邀请，
# 夜间出现空缺不发邀请、只给候补第 1 名发提示，等白天由 sweep 补发。时段 [start, end)，
# 默认 8:00–22:00（服务器时间 Asia/Shanghai）；窗口 120 秒不变。
app.invite-day-start-hour=${INVITE_DAY_START_HOUR:8}
app.invite-day-end-hour=${INVITE_DAY_END_HOUR:22}
# 超时扫描周期（秒）：SRS 建议 30；演示默认 10，方便现场看到顺延
app.sweep-seconds=${SWEEP_SECONDS:10}
# Jackson 时区：保留 Asia/Shanghai。PostgreSQL 驱动把 TIMESTAMP 列返回为
# Timestamp（Date 子类），Jackson 按此时区序列化才是库里存的东八区墙钟原值；
# MySQL 驱动返回 LocalDateTime，按原值序列化。此配置不是换算，与存储口径一致。
spring.jackson.time-zone=Asia/Shanghai

# 阶段二 CEM-08（2026-11-15）：签到码派生密钥与限流、出勤核对期。
# secret 为演示默认值，生产部署必须用环境变量 CHECKIN_SECRET 覆盖。
app.checkin.secret=${CHECKIN_SECRET:<redacted>}
# 签到码轮换窗（秒）：SDD 定 5 分钟=300；演示/测试可调小。
app.checkin.window-seconds=${CHECKIN_WINDOW_SECONDS:300}
# 错码限流：连续错满此数锁定 lock-minutes 分钟（SDD §6.9 错误验证应限流）。
app.checkin.max-fails=${CHECKIN_MAX_FAILS:5}
app.checkin.lock-minutes=${CHECKIN_LOCK_MINUTES:10}
# 出勤核对期（分钟）：SDD 定活动结束后 24 小时=1440；测试可调小验证定版。
app.attendance.verify-window-minutes=${ATTENDANCE_VERIFY_MINUTES:1440}

# 阶段三 CEM-10（2026-11-15）：信用结算申诉期（分钟）。SDD 定出勤结果形成后
# 7 日申诉期届满且无未决争议才结算；本实现以定版时间 + 本配置为结算门
# （默认 7 日 = 10080 分钟），测试可调小验证结算时序。
app.credit.appeal-minutes=${CREDIT_APPEAL_MINUTES:10080}

# 阶段四 CEM-09（2026-11-15）：人工重置凭据有效期（分钟，SDD 定 30 分钟一次性）。
app.governance.reset-minutes=${RESET_CREDENTIAL_MINUTES:30}

# 2026-11-17：活动封面图上传目录。默认相对应用工作目录的 uploads/，
# 放在 jar 外，重新打包不会丢图；部署时用 UPLOAD_DIR 指向持久磁盘。
app.upload-dir=${UPLOAD_DIR:uploads}
# 上传图片大小上限 5MB（与 CEM-09 证据上传口径一致），由控制器 uploadImage
# 的 file.getSize() 检查执行、返回 400「图片不能超过 5MB」。
# 容器层限额须高于业务限额（10MB 安全网）：若容器先拦，Spring 在解析
# multipart 时抛 MaxUploadSizeExceededException，控制器的 @ExceptionHandler
# 够不着（解析在 handler 执行前），Tomcat 直接断连接、客户端只看到
# Broken pipe，拿不到 400 与文案。2026-11-17 统筹验收 test_cover 第 2 项
# 失败后的修正（容器 5MB → 10MB；业务 5MB 不变）。
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# 结构自检开关（2026-11-18 Azure 事故）：旧库缺 notification.status / publish_at 时，
# 旧版应用仍能启动、健康检查照常 ok，报名/通知接口全部 500。现由 SchemaReadinessChecker
# 在启动期校验 24 张表与 4 个迁移补列，不符即中止启动。SCHEMA_CHECK_ENABLED=false 是
# 仅供临时排障的逃生开关，默认必须开启。
app.schema-check.enabled=${SCHEMA_CHECK_ENABLED:true}

# R6（2026-11-20）：Spring 默认调度线程池只有 1 个线程，全应用只有 SweepService.sweep
# 与 publishOutbox 两个 @Scheduled 共用它。慢 sweep（逐活动收尾、出勤/信用扫描）会堵住
# 每 500ms 一次的 outbox 发布，威胁「通知 5 秒内可见」口径。扩到 4 个线程后两者可并行；
# 两个方法都是幂等更新 / 逐条抢占，并行执行安全。
spring.task.scheduling.pool.size=4
